appId: com.claude-desktop.app
productName: Claude Desktop
copyright: Copyright © Claude Desktop contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# Workspace package is bundled into out/ by electron-vite; no asarUnpack of node_modules required for shared.
asar: true

# node-pty is a native module (pty.node + conpty.dll / OpenConsole.exe) — it
# must live outside the asar archive to load and spawn shells.
asarUnpack:
  - "**/node_modules/node-pty/**"

# Ship Claude Code CLI + CPA outside asar so they can be spawned.
# Populate vendor/ via: node scripts/prepare-vendor.mjs (from monorepo root).
extraResources:
  - from: ../../vendor/win-x64/claude
    to: bin/claude
    filter:
      - "**/*"
  - from: ../../vendor/win-x64/cpa
    to: bin/cpa
    filter:
      - "**/*"

# Windows: portable dir + NSIS installer.
# Disable signing/rcedit so packaging works offline without winCodeSign binaries.
win:
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false

nsis:
  # Multi-step wizard (not one-click).
  # Flow: Welcome → License → Install mode → Directory → Install.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # Do not launch the app immediately after install; user opens it when ready.
  runAfterFinish: false
  # Extra deliberate step before directory / install.
  license: build/license.txt
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claude Desktop
  # Keep userData (settings, sessions, CPA config) on uninstall.
  deleteAppDataOnUninstall: false
  artifactName: Claude-Desktop-Setup-${version}-${arch}.${ext}
  # Prefer Chinese UI when the OS is zh-CN (falls back to English).
  installerLanguages:
    - en_US
    - zh_CN
  displayLanguageSelector: false

forceCodeSigning: false

# electron-vite outputs
extraMetadata:
  main: out/main/index.js
