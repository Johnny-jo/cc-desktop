appId: com.cc-desktop.app
productName: CC Desktop
copyright: Copyright © CC Desktop contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # Native PTY module (externalized by electron-vite, not bundled into out/)
  - node_modules/node-pty/**

# Workspace package is bundled into out/ by electron-vite; no asarUnpack of node_modules required for shared.
asar: true

# node-pty ships prebuilt binaries (build/Release with conpty.dll etc.) and is
# EXTERNAL to asar (externalizeDepsPlugin keeps it in app node_modules).
# electron-builder's @electron/rebuild would invoke node-gyp and fail without
# a C++ toolchain — skip rebuilding entirely; the prebuilds work as-is.
# (No asarUnpack needed: real files live outside asar already.)
buildDependenciesFromSource: false
npmRebuild: false

# Ship Claude Code CLI + CPA outside asar so they can be spawned.
# Populate vendor/ via: node scripts/prepare-vendor.mjs (from monorepo root).
extraResources:
  - from: ../../vendor/win-x64/claude
    to: bin/claude
    filter:
      - "**/*"
  - from: ../../vendor/win-x64/cpa
    to: bin/cpa
    filter:
      - cli-proxy-api.exe
      - config.template.yaml
      - static/**
      - "!config.yaml"
      - "!config.yml"
  # Optional cloudflared for T2 room tunnels. The dir may stay empty —
  # prepare-vendor.mjs creates it; the binary itself is never committed.
  - from: ../../vendor/win-x64/cloudflared
    to: bin/cloudflared
    filter:
      - "**/*"
  - from: resources/mods
    to: mods
    filter:
      - "**/*"
  # BrowserWindow + notification-area tray icon. build/ is not packed into
  # app.asar because `files` intentionally contains only out/ + package.json.
  - from: build/icon.ico
    to: icon.ico

# Windows: portable dir + NSIS installer.
# Keep rcedit disabled so unsigned/offline packaging does not require Windows
# symlink privileges. The installer recreates shortcuts with resources/icon.ico.
win:
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false

nsis:
  # Multi-step wizard (not one-click).
  # Flow: Welcome → License → Install mode → Directory → Install.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # Do not launch the app immediately after install; user opens it when ready.
  runAfterFinish: false
  # Extra deliberate step before directory / install.
  license: build/license.txt
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CC Desktop
  # Never wipe AppData on uninstall/upgrade. NSIS upgrades run the previous
  # uninstaller first; deleting AppData there would wipe CPA + settings.
  # uninstall.nsh only stops CPA — it does not RMDir AppData.
  deleteAppDataOnUninstall: false
  include: build/uninstall.nsh
  artifactName: CC-Desktop-Setup-${version}-${arch}.${ext}
  # Prefer Chinese UI when the OS is zh-CN (falls back to English).
  installerLanguages:
    - en_US
    - zh_CN
  displayLanguageSelector: false

forceCodeSigning: false

# Publish target for electron-updater (generic HTTP feed).
# Intentionally blank in this file — a missing env must not bake
# "${env.CLAUDE_DESKTOP_UPDATE_URL}" into the installer.
# Pack-time: set CLAUDE_DESKTOP_UPDATE_URL=https://your-feed/
# afterPack writes resources/app-update.yml with that resolved URL.
afterPack: ../../scripts/after-pack-app-update.cjs

# electron-vite outputs
extraMetadata:
  main: out/main/index.js
