# Claude Desktop — bundled CPA (CLIProxyAPI) template
# On first run this is copied to userData/cpa/config.yaml and adjusted.

# Bind localhost only (desktop embedding).
host: "127.0.0.1"
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  # Localhost-only management UI (/management.html).
  # secret-key is required — empty disables the whole Management API (404).
  # First-run / onboarding fills this with the same gateway token as api-keys
  # so one password works for API + control panel login.
  allow-remote: false
  secret-key: "change-me"
  disable-control-panel: false

# Reuse the same credential store as a standalone CPA install when present.
auth-dir: "~/.cli-proxy-api"

# Client keys accepted by the local gateway. Claude Desktop stores the matching
# token in its own encrypted settings (Settings → Auth token).
api-keys:
  - change-me

debug: false
