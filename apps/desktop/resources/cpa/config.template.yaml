# CC Desktop — bundled CLIProxyAPI v8 template.
# Only placeholders are packaged; existing user/provider credentials are preserved.
config-version: 8
server:
  host: "127.0.0.1"
  port: 8317
  tls:
    enable: false
    cert: ""
    key: ""
management:
  allow-remote: false
  # Onboarding uses the gateway token for both client and management access.
  secret-key: "change-me"
  disable-control-panel: false
  # Upgrade the panel with the bundled backend, never independently to latest.
  disable-auto-update-panel: true

oauth:
  auth-dir: "~/.cli-proxy-api"
access:
  api-keys:
    - change-me
observability:
  logs:
    debug: false
